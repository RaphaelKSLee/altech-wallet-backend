spring:
  application:
    name: altech-wallet-backend

  datasource:
    # Uses the environment variables if present; otherwise falls back to localhost defaults
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: create # Use 'validate' or 'none' in production

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  modulith:
    detection-strategy: dev.raphaellee.altechwalletbackend.modulith.TwoLevelModuleStrategy