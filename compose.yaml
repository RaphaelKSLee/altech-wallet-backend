services:
  # 1. The Database Service
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      # Docker Compose pulls these values directly from the .env file
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # 2. The Spring Boot App Service
  app:
    image: altech-wallet-backend:latest
    ports:
      - "8080:8080"
    environment:
      # We override the DB_HOST to point to the 'db' container name
      DB_HOST: db
      DB_PORT: 5432
      # We pass the same .env variables down to Spring Boot
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db

volumes:
  postgres-data: